name: Publish the index

# Builds the whole index from the releases pins.json names and deploys it to
# GitHub Pages. A release in any source repository sends a
# `publish-package-release` dispatch here (PyDevices/.github's
# reusable-request-mip-publication.yml), naming its profile, repository and
# tag; the run records the tag in pins.json, rebuilds every package from the
# pins, and deploys.
#
# Recording comes first and is not queued. GitHub's concurrency group holds one
# running job and one pending job, and a newer pending job replaces the older
# one, so a request that waited in the queue could be replaced by a later one
# and its pin never written. Instead the `record` job commits the pin to main
# the moment the request arrives; only the build and the deploy queue. Each
# build starts by checking out main, so it carries every pin recorded before
# it started, and a build that replaces a pending one still publishes the
# pending one's release. (pins.json therefore says what was asked for; a
# build that fails leaves its pin there, and the next build fails the same way
# until the pin is fixed.)
#
# A merge to pydevices' main that touches board_configs/ or drivers/ sends the
# same dispatch with the `boards` profile and the merge commit. The run lays
# that commit's two folders over the pinned pydevices release (tools/pins.py),
# so a board or driver is published when it merges. The next pydevices release
# clears the pin.

on:
  repository_dispatch:
    types:
      - publish-package-release
  workflow_dispatch:
    inputs:
      profile:
        description: Profile to record (pydevices, boards, palettes, pdwidgets, pygraphics, audioinstruments, audioeffects). Empty rebuilds from the pins as they are.
        default: ""
        type: string
      repository:
        description: OWNER/REPOSITORY the release came from
        default: ""
        type: string
      ref:
        description: Release tag to record (a full commit hash for the boards profile)
        default: ""
        type: string
      test-root-ref:
        description: A test build only. Build the library repository at this branch, tag or commit, record nothing, and deploy it.
        default: ""
        type: string

permissions:
  contents: read

env:
  PROFILE: ${{ github.event.client_payload.profile || inputs.profile }}
  REPOSITORY: ${{ github.event.client_payload.source_repository || inputs.repository }}
  REF: ${{ github.event.client_payload.source_ref || inputs.ref }}
  TEST_ROOT_REF: ${{ inputs.test-root-ref }}
  # mpy-cross's bytecode version is the one every board reads (v6.3).
  MPY_CROSS_PIP: mpy-cross==1.29.0.post2

jobs:
  record:
    # Not in the queue: every request writes its pin before it waits.
    if: github.event.client_payload.profile != '' || (inputs.profile != '' && inputs.test-root-ref == '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Record the release in pins.json on main
        run: python tools/pins.py record --profile "$PROFILE" --repository "$REPOSITORY" --ref "$REF"

  build:
    needs: record
    # The record job is skipped for a rebuild or a test build, which is fine;
    # it failing (a request pins.py refuses) is not.
    if: ${{ !failure() && !cancelled() }}
    concurrency:
      group: omnipython-lib-publication-queue
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Check out the pinned sources
        run: |
          args=(--out src)
          if [ -n "$TEST_ROOT_REF" ]; then args+=(--root-ref "$TEST_ROOT_REF"); fi
          python tools/pins.py fetch "${args[@]}"
          python tools/pins.py lock src

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install mpy-cross
        run: python -m pip install "$MPY_CROSS_PIP"

      - name: Build the index
        run: python src/tools/libbuild.py build --root src --out build --base-url "${{ steps.pages.outputs.base_url }}"

      - name: Check the index against the pins
        run: python tools/pins.py verify build/index

      - name: Prepare the Pages artifact
        run: touch build/index/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/index

  deploy:
    needs: build
    # The same queue as the build, so two deploys never overlap.
    concurrency:
      group: omnipython-lib-publication-queue
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
