name: Publish the index

# Builds the whole index from the releases pins.json names and deploys it to
# GitHub Pages. A release in any source repository sends a
# `publish-package-release` dispatch here (PyDevices/.github's
# reusable-request-mip-publication.yml), naming its profile, repository and
# tag; the run records the tag in pins.json, rebuilds every package from the
# pins, and deploys. Runs queue one behind another: each rebuilds everything,
# so the last one in wins, and none is cancelled for a later one.

on:
  repository_dispatch:
    types:
      - publish-package-release
  workflow_dispatch:
    inputs:
      profile:
        description: Profile to record (pydevices, palettes, pdwidgets, pygraphics, audioinstruments, audioeffects). Empty rebuilds from the pins as they are.
        default: ""
        type: string
      repository:
        description: OWNER/REPOSITORY the release came from
        default: ""
        type: string
      ref:
        description: Release tag to record
        default: ""
        type: string
      test-root-ref:
        description: A test build only. Build the library repository at this branch, tag or commit, record nothing, and deploy it.
        default: ""
        type: string

concurrency:
  group: omnipython-lib-publication-queue
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROFILE: ${{ github.event.client_payload.profile || inputs.profile }}
  REPOSITORY: ${{ github.event.client_payload.source_repository || inputs.repository }}
  REF: ${{ github.event.client_payload.source_ref || inputs.ref }}
  TEST_ROOT_REF: ${{ inputs.test-root-ref }}
  # mpy-cross's bytecode version is the one every board reads (v6.3).
  MPY_CROSS: mpy-cross==1.29.0.post2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Record the release
        if: env.PROFILE != '' && env.TEST_ROOT_REF == ''
        run: python tools/pins.py apply --profile "$PROFILE" --repository "$REPOSITORY" --ref "$REF"

      - name: Check out the pinned sources
        run: |
          args=(--out src)
          if [ -n "$TEST_ROOT_REF" ]; then args+=(--root-ref "$TEST_ROOT_REF"); fi
          python tools/pins.py fetch "${args[@]}"
          python tools/pins.py lock src

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install mpy-cross
        run: python -m pip install "$MPY_CROSS"

      - name: Build the index
        run: python src/tools/libbuild.py build --root src --out build --base-url "${{ steps.pages.outputs.base_url }}"

      - name: Check the index against the pins
        run: python tools/pins.py verify build/index

      - name: Keep what the record job commits
        run: cp pins.json "$RUNNER_TEMP/pins.json"

      - name: Prepare the Pages artifact
        run: touch build/index/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/index

      - uses: actions/upload-artifact@v7
        with:
          name: pins
          path: ${{ runner.temp }}/pins.json

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  record:
    # pins.json says what is live, so it changes only once the deploy worked.
    needs: deploy
    if: github.event.client_payload.profile != '' || (inputs.profile != '' && inputs.test-root-ref == '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          name: pins
          path: ${{ runner.temp }}/pins
      - name: Commit pins.json
        run: |
          cp "$RUNNER_TEMP/pins/pins.json" pins.json
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add pins.json
          if git diff --cached --quiet; then
            echo "pins.json already records ${PROFILE} ${REF}."
            exit 0
          fi
          git commit -m "Publish ${REPOSITORY#*/} ${REF}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          echo "push failed after 3 attempts" >&2
          exit 1
